org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# App configuration -> BuildConfig
# These are safe, non-secret placeholders. Override any of them in
# local.properties (gitignored) so your real values never get committed.
# ---------------------------------------------------------------------------
# Base URL of YOUR backend (must be HTTPS and end with a slash).
BACKEND_BASE_URL=https://api.example.com/
# true = use FakeRecipeRepository / FakeUsageRepository so the UI runs without a backend.
USE_FAKE_BACKEND=true
PRIVACY_URL=https://example.com/privacy
TERMS_URL=https://example.com/terms
SUPPORT_EMAIL=support@example.com
# TheMealDB key for the Discover recipe library. "1" = free test key (development only).
MEALDB_API_KEY=1

# Cloudflare Worker config. Secrets (Turso token, Gemini key, Play key) are NOT here:
# `npm run setup` stores them as encrypted Worker secrets.
name = "what-to-cook-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Gemini model used for recipes. Change it here if Google renames/retires it.
GEMINI_MODEL = "gemini-2.5-flash"
FREE_WEEKLY_LIMIT = "7"
PRO_WEEKLY_LIMIT = "100"
# Android applicationId and the Play subscription product ID (see BillingProducts.kt).
PACKAGE_NAME = "com.whattocook.app"
PRO_PRODUCT_ID = "what_to_cook_pro"
